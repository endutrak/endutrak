# Sincroniza eventos + vídeos de YouTube y guarda los datos en el repo.
# La publicación la hace Cloudflare, que redespliega solo con cada commit a main
# (incluido el de este bot). Se ejecuta: cada día (~6-7:00 hora España), al hacer
# push a main y a mano con «Sincronizar ahora». Los eventos propios salen de Notion.
name: Sincronizar y publicar

on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Eventos (calendario off-road)
        run: node scripts/sync-events.mjs
        env:
          EVENTS_ICS_URL: ${{ secrets.EVENTS_ICS_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        continue-on-error: true

      - name: Vídeos y shorts del canal
        run: node scripts/sync-youtube.mjs
        continue-on-error: true

      - name: Páginas para buscadores (eventos, zonas, sitemap)
        run: node scripts/build-seo.mjs

      - name: Guardar datos si han cambiado
        id: commit
        run: |
          git config user.name "endutrak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site scripts/geocache.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "datos: sincronización automática"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
